[common]
; 手机号账号(必填)
username = xxx

; 登录密码(必填)
password = xxx

; 要学习的课程ID列表, 逗号隔开(选填，不需要则留空)
course_list = xxx,xxx,xxx

; 视频播放倍速(默认1，最大2)
speed = 1
[tiku]
; ============ 重要说明 ============
; 本地运行: 本文件(config.ini)内的 [tiku] 配置生效
; 云端运行: 不需要本文件!GitHub Actions 会自动从环境变量读取题库配置,
;           请在仓库 Settings -> Secrets and variables -> Actions 中配置:
;           TIKU_PROVIDER / TIKU_SUBMIT / DEEPSEEK_API_KEY
; 题库说明: 仅使用 DeepSeek AI 答题,全部使用 flash 系列模型,禁止使用 PRO 模型
;           图片题:先用视觉模型 deepseek-v4-flash-vision-exp 把图片识别为文字,
;                   再把识别出的文字与题目一起交给文本 flash 模型 deepseek-v4-flash 推理答案
;           纯文字题:直接交给 deepseek-v4-flash 推理
provider=TikuDeepSeek
; 是否直接提交答题，填写false表示答完题后不提交而是保存，随后你可以自行前往学习通修改或提交
; 填写true表示直接提交，不保证正确率！不正确的填写会被视为false
; 对于那些需要解锁的章节，你必须要提交章节检测才能继续下一章节的学习，自行决定是否开启
; 建议: 保持 false(只保存不提交)，人工核对后再提交
submit=false
; DeepSeek API Key
; 本地运行填在这里即可(config.ini 已被 .gitignore 忽略,不会上传)
; 云端运行(GitHub Actions)不用填,请在仓库 Settings -> Secrets and variables -> Actions
; 中配置名为 DEEPSEEK_API_KEY 的密钥,云端会自动注入,优先于此处
api_key=
; 用于判断判断题对应的选项，不要留有空格，不要留有引号，逗号为英文逗号
true_list=正确,对,√,是
false_list=错误,错,×,否,不对,不正确
