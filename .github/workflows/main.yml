name: 学习通自动刷课
 
on: # 什么时候触发
  push:
    branches: [ master, main ]
  workflow_dispatch:  # 允许手动触发;通过 submit 输入控制是否提交答案
    inputs:
      submit:
        description: '是否把答案提交到学习通: true=直接提交 / false=只保存不提交'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      recheck:
        description: '是否重刷平台已判定通过的视频(确保每个视频都到100%,较慢)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      dump:
        description: '诊断:打印视频卡片原始JSON与跳过详情(排查"视频没刷"用,日常保持false)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  # 定时触发(已暂时注释)。如需每天自动运行,取消下面 3 行注释即可。
  # schedule:
  #   - cron: '0 18 * * *'    # 北京时间 次日 02:00
  #   - cron: '30 22 * * *'   # 北京时间 次日 06:30

# 同一时间只允许一个刷课流程运行:重复触发会排队而不是同时跑,避免两个任务互相打架
concurrency:
  group: chaoxing-brush
  cancel-in-progress: false

# ================== 自动接力说明 ==================
# GitHub 单个 job 最多只能跑 6 小时,全部课程可能一轮刷不完。
# 因此把刷课拆成 brush1→brush2→brush3→brush4 四轮串联:
#   main.py 每轮带 --max-minutes 320(5小时20分)时间预算;
#   预算用尽 -> 写入 brush_state=continue -> 自动接力下一轮(已完成的任务会被平台标记跳过,不重复刷);
#   全部任务刷完 -> 写入 brush_state=done -> 后续轮次自动跳过,流程结束。
jobs: # 执行的工作
  brush1:
    name: 第1轮刷课
    runs-on: ubuntu-latest # 在最新版本的 Ubuntu 操作系统环境下运行
    timeout-minutes: 360   # 单轮上限 6 小时(GitHub 上限)
    outputs:
      remaining: ${{ steps.brush.outputs.remaining }}
    steps: # 要执行的步骤
      - name: Checkout code
        uses: actions/checkout@v3  # 用于将github代码仓库的代码拷贝到工作目录中
 
      - name: Set up Python
        uses: actions/setup-python@v2 # 用于设置 Python 环境，它允许你指定要在工作环境中使用的 Python 版本
        with:
          python-version: '3.9'  # 选择要用的Python版本
 
      - name: Install requirements.txt
        run: | # 安装依赖包
          pip install -r ./requirements.txt 
 
      - name: Run main.py
        id: brush
        continue-on-error: true
        # 所有账号、密码与 API Key 全部从 GitHub Secrets 读取，不要直接写在代码里！
        # 在仓库 Settings -> Secrets and variables -> Actions 中配置以下密钥:
        #   CX_USERNAME      : 你的学习通手机号
        #   CX_PASSWORD      : 你的学习通密码
        #   COURSE_LIST      : 要学习的课程ID列表(留空/不配置=刷该账号全部课程)
        #   DEEPSEEK_API_KEY : DeepSeek API Key,申请 https://platform.deepseek.com
        #   TIKU_PROVIDER    : 题库类型,填写 TikuDeepSeek(仅支持 DeepSeek 答题)
        env:
          CX_USERNAME: ${{ secrets.CX_USERNAME }}
          CX_PASSWORD: ${{ secrets.CX_PASSWORD }}
          COURSE_LIST: ${{ secrets.COURSE_LIST }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TIKU_PROVIDER: ${{ secrets.TIKU_PROVIDER }}
          TIKU_SUBMIT: ${{ inputs.submit || 'false' }}          # true=正式提交(测验任务点才能完成) / false=只保存
          CX_RECHECK_PASSED: ${{ inputs.recheck || 'false' }}   # true=连平台已通过的视频也重刷到100%
          CX_DUMP_CARDS: ${{ inputs.dump || 'false' }}          # true=打印视频卡片原始JSON(诊断用)
        run: |
          set +e
          python main.py -u "$CX_USERNAME" -p "$CX_PASSWORD" -l "$COURSE_LIST" -s 1 --max-minutes 320
          echo "main.py 退出码: $?"
          state=$(cat brush_state 2>/dev/null || echo continue)
          echo "本轮结束状态: $state"
          if [ "$state" = "continue" ]; then
            echo "remaining=true" >> "$GITHUB_OUTPUT"
            echo "本轮到时间预算上限,将自动接力下一轮"
          else
            echo "remaining=false" >> "$GITHUB_OUTPUT"
            echo "全部课程任务已刷完,无需接力"
          fi

  brush2:
    name: 第2轮刷课(接力)
    needs: brush1
    if: always() && needs.brush1.result != 'skipped' && needs.brush1.outputs.remaining != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      remaining: ${{ steps.brush.outputs.remaining }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'
      - name: Install requirements.txt
        run: pip install -r ./requirements.txt
      - name: Run main.py
        id: brush
        continue-on-error: true
        env:
          CX_USERNAME: ${{ secrets.CX_USERNAME }}
          CX_PASSWORD: ${{ secrets.CX_PASSWORD }}
          COURSE_LIST: ${{ secrets.COURSE_LIST }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TIKU_PROVIDER: ${{ secrets.TIKU_PROVIDER }}
          TIKU_SUBMIT: ${{ inputs.submit || 'false' }}
          CX_RECHECK_PASSED: ${{ inputs.recheck || 'false' }}
          CX_DUMP_CARDS: ${{ inputs.dump || 'false' }}
        run: |
          set +e
          python main.py -u "$CX_USERNAME" -p "$CX_PASSWORD" -l "$COURSE_LIST" -s 1 --max-minutes 320
          echo "main.py 退出码: $?"
          state=$(cat brush_state 2>/dev/null || echo continue)
          echo "本轮结束状态: $state"
          if [ "$state" = "continue" ]; then
            echo "remaining=true" >> "$GITHUB_OUTPUT"
            echo "本轮到时间预算上限,将自动接力下一轮"
          else
            echo "remaining=false" >> "$GITHUB_OUTPUT"
            echo "全部课程任务已刷完,无需接力"
          fi

  brush3:
    name: 第3轮刷课(接力)
    needs: brush2
    if: always() && needs.brush2.result != 'skipped' && needs.brush2.outputs.remaining != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      remaining: ${{ steps.brush.outputs.remaining }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'
      - name: Install requirements.txt
        run: pip install -r ./requirements.txt
      - name: Run main.py
        id: brush
        continue-on-error: true
        env:
          CX_USERNAME: ${{ secrets.CX_USERNAME }}
          CX_PASSWORD: ${{ secrets.CX_PASSWORD }}
          COURSE_LIST: ${{ secrets.COURSE_LIST }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TIKU_PROVIDER: ${{ secrets.TIKU_PROVIDER }}
          TIKU_SUBMIT: ${{ inputs.submit || 'false' }}
          CX_RECHECK_PASSED: ${{ inputs.recheck || 'false' }}
          CX_DUMP_CARDS: ${{ inputs.dump || 'false' }}
        run: |
          set +e
          python main.py -u "$CX_USERNAME" -p "$CX_PASSWORD" -l "$COURSE_LIST" -s 1 --max-minutes 320
          echo "main.py 退出码: $?"
          state=$(cat brush_state 2>/dev/null || echo continue)
          echo "本轮结束状态: $state"
          if [ "$state" = "continue" ]; then
            echo "remaining=true" >> "$GITHUB_OUTPUT"
            echo "本轮到时间预算上限,将自动接力下一轮"
          else
            echo "remaining=false" >> "$GITHUB_OUTPUT"
            echo "全部课程任务已刷完,无需接力"
          fi

  brush4:
    name: 第4轮刷课(接力)
    needs: brush3
    if: always() && needs.brush3.result != 'skipped' && needs.brush3.outputs.remaining != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      remaining: ${{ steps.brush.outputs.remaining }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'
      - name: Install requirements.txt
        run: pip install -r ./requirements.txt
      - name: Run main.py
        id: brush
        continue-on-error: true
        env:
          CX_USERNAME: ${{ secrets.CX_USERNAME }}
          CX_PASSWORD: ${{ secrets.CX_PASSWORD }}
          COURSE_LIST: ${{ secrets.COURSE_LIST }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TIKU_PROVIDER: ${{ secrets.TIKU_PROVIDER }}
          TIKU_SUBMIT: ${{ inputs.submit || 'false' }}
          CX_RECHECK_PASSED: ${{ inputs.recheck || 'false' }}
          CX_DUMP_CARDS: ${{ inputs.dump || 'false' }}
        run: |
          set +e
          python main.py -u "$CX_USERNAME" -p "$CX_PASSWORD" -l "$COURSE_LIST" -s 1 --max-minutes 320
          echo "main.py 退出码: $?"
          state=$(cat brush_state 2>/dev/null || echo continue)
          echo "本轮结束状态: $state"
          if [ "$state" = "continue" ]; then
            echo "remaining=true" >> "$GITHUB_OUTPUT"
            echo "本轮到时间预算上限(已是最后一轮,如仍未刷完请再手动触发一次)"
          else
            echo "remaining=false" >> "$GITHUB_OUTPUT"
            echo "全部课程任务已刷完,无需接力"
          fi
